<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Leaving App</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#fff;
  color:#0a0f1a;
  overflow-x:hidden;
  overflow-y:auto;
}
/* 5 GIF Gallery */
.gif-gallery{
  max-width:600px;
  margin:20px auto;
  padding:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.gif-item{
  width:100%;
  overflow:hidden;
  border-radius:10px;
  background:#f1f1f1;
}
.gif-item img{
  display:block;
  width:100%;
  height:170px;
  object-fit:cover;
}
.gif-item:last-child{
  grid-column:span 2;
}
.gif-item:last-child img{
  height:200px;
}
/* Popup Overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:10;
}
/* Popup Container */
.popup-container{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  pointer-events:none;
  z-index:20;
}
.popup{
  position:relative;
  background:#fff;
  border-radius:8px;
  padding:24px;
  max-width:420px;
  width:100%;
  pointer-events:auto;
  animation:popupIn .4s ease;
}
.popup h1{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}
.popup p{
  font-size:15px;
  line-height:1.6;
  margin-bottom:22px;
}
.popup .actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
}
.popup button{
  background:transparent;
  border:none;
  padding:10px;
  font-size:14px;
  font-weight:600;
  color:#0a0f1a;
  cursor:pointer;
  transition:color .2s;
}
.popup button:hover{
  color:#6b7280;
}
.popup button.continue:hover{
  color:#1d4ed8;
}
@keyframes popupIn{
  from{
    opacity:0;
    transform:translateY(0) scale(.9);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
</style>
</head>
<body>
<!-- 5 GIF IMAGES -->
<div class="gif-gallery">
  <div class="gif-item">
    <img src="https://i.imgur.com/81T0wGQ.gif" alt="GIF Image 1">
  </div>
  <div class="gif-item">
    <img src="https://i.imgur.com/CLCHpjw.gif" alt="GIF Image 2">
  </div>
  <div class="gif-item">
    <img src="https://i.imgur.com/ITixDye.gif" alt="GIF Image 3">
  </div>
  <div class="gif-item">
    <img src="https://i.imgur.com/81T0wGQ.gif" alt="GIF Image 4">
  </div>
  <div class="gif-item">
    <img src="https://i.imgur.com/81T0wGQ.gif" alt="GIF Image 5">
  </div>
</div>
<!-- POPUP -->
<div class="overlay"></div>
<div class="popup-container" id="popupContainer"></div>
<script>
var TARGET_URL = "https://www.profitableratecpmnetwork.com/wfgse0gu0?key=dfa595cebf5450be98481dd0467d958f";
var popupCount = 0;
function isInApp(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || "";
  return (
    ua.indexOf("FBAN") !== -1 ||
    ua.indexOf("FBAV") !== -1 ||
    ua.indexOf("Instagram") !== -1 ||
    ua.indexOf("Messenger") !== -1 ||
    ua.indexOf("TelegramBot") !== -1 ||
    ua.indexOf("Telegram") !== -1 ||
    /\bLine\b/i.test(ua) ||
    ua.indexOf("Snapchat") !== -1 ||
    ua.indexOf("Twitter") !== -1 ||
    ua.indexOf("Pinterest") !== -1 ||
    ua.indexOf("MicroMessenger") !== -1
  );
}
function openChrome(url){
  var clean = url.replace(/^https?:\/\//, "");
  window.location.href =
  "intent://" + clean +
  "#Intent;scheme=https;package=com.android.chrome;end";
}
function openExternalIOS(url){
  window.location.href = "x-safari-" + url;
  setTimeout(function(){
    window.location.href =
    "googlechromes://" + url.replace("https://", "");
  },500);
  setTimeout(function(){
    window.location.href =
    "firefox://open-url?url=" + encodeURIComponent(url);
  },1000);
  setTimeout(function(){
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  },1500);
}
function createPopup(){
  popupCount++;
  var div = document.createElement("div");
  div.className = "popup";
  div.style.zIndex = 100 + popupCount;
  div.innerHTML =
    '<h1>You\'re leaving our app</h1>' +
    '<p>The website you\'re viewing is attempting to open an external app. Would you like to continue?</p>' +
    '<div class="actions">' +
    '<button onclick="goBack()">GO BACK</button>' +
    '<button class="continue" onclick="continueAction()">CONTINUE</button>' +
    '</div>';
  document.getElementById("popupContainer").appendChild(div);
}
function goBack(){
  document.getElementById("popupContainer").innerHTML = "";
  document.querySelector(".overlay").style.display = "none";
}
function continueAction(){
  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua);
  if(isInApp()){
    if(isAndroid){
      openChrome(TARGET_URL);
    }else if(isIOS){
      openExternalIOS(TARGET_URL);
    }else{
      window.open(TARGET_URL,"_blank");
    }
  }else{
    window.open(TARGET_URL,"_blank");
  }
}
// Popup on page load
(function(){
  createPopup();
})();
</script>
</body>
</html>
